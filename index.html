<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSC 命題說話分類工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body { 
            background: linear-gradient(135deg, #e0f2fe 0%, #fdf2f8 50%, #fff9db 100%);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            color: #1e293b;
            margin: 0;
            padding-bottom: env(safe-area-inset-bottom, 2rem);
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* 模式切換器字體加大 */
        .mode-btn { 
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            border-radius: 0.75rem;
            transition: all 0.3s;
            font-weight: 800;
            color: #475569;
        }
        .mode-btn.active { 
            background: #3b82f6; 
            color: white; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); 
        }

        /* 核心卡牌：字體加大 */
        .card-container { perspective: 1000px; }
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .is-flipped { transform: rotateY(180deg); }
        .card-face { 
            backface-visibility: hidden; 
            border-radius: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            inset: 0;
            padding: 1.5rem;
        }
        .card-front-design { background: white; border: 4px solid #3b82f6; }
        .card-back-design { 
            transform: rotateY(180deg); 
            background: #ffffff;
            border: 4px solid #10b981;
        }

        /* 分類按鈕：針對手機優化為大字體 */
        .cat-btn { 
            transition: all 0.2s ease;
            background: white;
            border: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            width: 100%;
            border-radius: 1.25rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .cat-btn:active { transform: scale(0.97); background: #f8fafc; border-color: #3b82f6; }
        .cat-name { font-size: 1.15rem; font-weight: 900; color: #1e293b; }
        .cat-count { background: #3b82f6; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 900; }

        #topic-display { transition: opacity 0.2s ease; }
        .text-fade-out { opacity: 0; }
    </style>
</head>
<body class="relative">

    <!-- 頂部固定的導航與標題 -->
    <header class="sticky top-0 z-50 glass px-4 py-3 flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black text-slate-800 tracking-tighter">
                PSC 命題說話分類工具
            </h1>
            <button onclick="exportData()" class="bg-slate-800 text-white px-4 py-2 rounded-full text-xs font-black shadow-lg">
                導出報告
            </button>
        </div>
        
        <div class="flex justify-center gap-1 bg-slate-100 p-1 rounded-xl">
            <button id="btn-m1" onclick="initApp(1)" class="mode-btn flex-1 active">分類模式 1</button>
            <button id="btn-m2" onclick="initApp(2)" class="mode-btn flex-1">分類模式 2</button>
            <button id="btn-m3" onclick="initApp(3)" class="mode-btn flex-1">自定義</button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-6 pb-12 flex flex-col items-center">
        
        <!-- 自定義 UI -->
        <div id="custom-ui" class="hidden glass p-5 rounded-3xl mb-6 w-full border-2 border-white mt-2">
            <p class="text-center text-xs font-bold text-slate-500 mb-4 text-xs">輸入類別後點擊下方「套用」</p>
            <div class="grid grid-cols-3 gap-2">
                <input type="text" placeholder="類別1" class="custom-input p-3 text-sm rounded-xl bg-white border border-slate-200 outline-none text-center">
                <input type="text" placeholder="類別2" class="custom-input p-3 text-sm rounded-xl bg-white border border-slate-200 outline-none text-center">
                <input type="text" placeholder="類別3" class="custom-input p-3 text-sm rounded-xl bg-white border border-slate-200 outline-none text-center">
                <input type="text" placeholder="類別4" class="custom-input p-3 text-sm rounded-xl bg-white border border-slate-200 outline-none text-center">
                <input type="text" placeholder="類別5" class="custom-input p-3 text-sm rounded-xl bg-white border border-slate-200 outline-none text-center">
                <input type="text" placeholder="類別6" class="custom-input p-3 text-sm rounded-xl bg-white border border-slate-200 outline-none text-center">
                <button onclick="applyCustom()" class="col-span-full bg-blue-600 text-white py-3 rounded-xl font-black mt-2">套用設定</button>
            </div>
        </div>

        <!-- 核心話題展示區 -->
        <div class="w-full mb-8">
            <div class="card-container w-full h-44 md:h-52 mb-6">
                <div id="main-card" class="card-inner w-full h-full relative" onclick="flipCard()">
                    <div class="card-face card-front-design">
                        <div class="text-center">
                            <span class="text-4xl mb-2 block">👆</span>
                            <p class="text-blue-600 font-black text-sm tracking-widest uppercase">點擊翻開話題</p>
                        </div>
                    </div>
                    <div class="card-face card-back-design">
                        <h2 id="topic-display" class="text-2xl md:text-3xl font-black text-slate-800 leading-tight text-center">準備中...</h2>
                    </div>
                </div>
            </div>
            
            <!-- 進度條 -->
            <div class="w-full px-2">
                <div class="flex justify-between text-[11px] font-black text-slate-500 mb-2">
                    <span id="counter">進度：0 / 50</span>
                    <span id="percent-text">0%</span>
                </div>
                <div class="h-3 w-full bg-white/50 rounded-full p-0.5">
                    <div id="progress-bar" class="h-full bg-blue-500 rounded-full transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 類別選擇區：字體特大化 -->
        <div class="w-full space-y-3 mb-10">
            <p class="text-center text-slate-400 font-bold text-xs uppercase tracking-widest mb-2">— 請選擇分類項目 —</p>
            <div id="action-zones" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- 按鈕動態生成 -->
            </div>
        </div>

        <!-- 放回功能 -->
        <button onclick="undoLast()" class="flex items-center gap-2 text-slate-500 font-bold py-2 px-6 rounded-full hover:bg-white transition-all text-sm mb-12">
            <span>↺</span> 放回上一張 (撤銷)
        </button>

    </main>

    <audio id="flip-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2016/2016-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const topics = ["1. 我的一天","2.老師","3.珍貴的禮物","4.假日生活","5.我喜愛的植物","6.我的理想（或願望）","7.過去的一年","8.朋友","9.童年生活","10.我的興趣愛好","11.家鄉（或熟悉的地方）","12.我喜歡的季節（或天氣）","13.印象深刻的書籍（或報刊）","14.難忘的旅行","15.我喜歡的美食","16.我所在的學校（或公司、團隊、其他機構）","17.尊敬的人","18.我喜愛的動物","19.我瞭解的地域文化（或風俗）","20.體育運動的樂趣","21.讓我快樂的事情","22.我喜歡的節日","23.我欣賞的歷史人物","24.勞動的體會","25.我喜歡的職業（或專業）","26.嚮往的地方","27.讓我感動的事情","28.我喜愛的藝術形式","29.我瞭解的十二生肖","30.學習普通話（或其他語言）的體會","31.家庭對個人成長的影響","32.生活中的誠信","33.談服飾","34.自律與我","35.對終身學習的看法","36.談談衛生與健康","37.對環境保護的認識","38.談社會公德（或職業道德）","39.對團隊精神的理解","40.談中國傳統文化","41.科技發展與社會生活","42.談個人修養","43.對幸福的理解","44.如何保持良好的心態","45.對垃圾分類的認識","46.網絡時代的生活","47.對美的看法","48.談傳統美德","49.對親情（或友情、愛情）的理解","50. 小家、大家與國家"];

        let currentIndex = 0, results = {}, history = [];
        const flipSound = document.getElementById('flip-sound');

        const configs = { 
            1: ["人物", "事物", "經歷和生活", "理想和願望", "觀點和評論"], 
            2: ["個人生活", "人際關係", "學習和工作", "社會議題評論", "知識文化"] 
        };

        function initApp(modeId) {
            document.querySelectorAll('.mode-btn').forEach((b, i) => b.classList.toggle('active', i+1 === modeId));
            document.getElementById('custom-ui').classList.toggle('hidden', modeId !== 3);
            if(modeId !== 3) renderButtons(configs[modeId]);
        }

        function renderButtons(categories) {
            const container = document.getElementById('action-zones');
            container.innerHTML = ''; results = {};
            categories.forEach(cat => {
                results[cat] = [];
                const btn = document.createElement('button');
                btn.className = "cat-btn";
                btn.innerHTML = `<span class="cat-name">${cat}</span><span id="cnt-${cat}" class="cat-count">0</span>`;
                btn.onclick = () => classifyTo(cat);
                container.appendChild(btn);
            });
            updateTopicDisplay(true);
        }

        function applyCustom() {
            const cats = Array.from(document.querySelectorAll('.custom-input')).map(i => i.value.trim()).filter(v => v);
            if(cats.length) { renderButtons(cats); document.getElementById('custom-ui').classList.add('hidden'); }
        }

        function flipCard() {
            if(currentIndex < topics.length) {
                const card = document.getElementById('main-card');
                if(!card.classList.contains('is-flipped')) {
                    flipSound.currentTime = 0; flipSound.play();
                    card.classList.add('is-flipped');
                }
            }
        }

        function classifyTo(category) {
            const card = document.getElementById('main-card');
            if(!card.classList.contains('is-flipped') || currentIndex >= topics.length) return;
            history.push({ index: currentIndex, category: category });
            results[category].push(topics[currentIndex]);
            document.getElementById(`cnt-${category}`).innerText = results[category].length;
            currentIndex++;
            card.classList.remove('is-flipped');
            setTimeout(() => updateTopicDisplay(), 300);
        }

        function undoLast() {
            if(!history.length) return;
            const last = history.pop();
            currentIndex = last.index;
            results[last.category].pop();
            document.getElementById(`cnt-${last.category}`).innerText = results[last.category].length;
            document.getElementById('main-card').classList.remove('is-flipped');
            setTimeout(() => updateTopicDisplay(), 300);
        }

        function updateTopicDisplay(init = false) {
            const display = document.getElementById('topic-display');
            display.classList.add('text-fade-out');
            setTimeout(() => {
                display.innerText = currentIndex < topics.length ? topics[currentIndex] : "🎉 分類完成";
                display.classList.remove('text-fade-out');
            }, init ? 0 : 150);
            const p = (currentIndex / topics.length) * 100;
            document.getElementById('progress-bar').style.width = p + '%';
            document.getElementById('counter').innerText = `進度：${currentIndex} / 50`;
            document.getElementById('percent-text').innerText = Math.round(p) + '%';
        }

        function exportData() {
            let text = "PSC 分類報告\n" + "=".repeat(20) + "\n\n";
            for (let cat in results) {
                text += `【${cat}】:\n${results[cat].length ? results[cat].join('\n') : "(空)"}\n\n`;
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `PSC_Report_${new Date().toLocaleDateString()}.txt`;
            a.click();
        }

        window.onload = () => initApp(1);
    </script>
</body>
</html>
